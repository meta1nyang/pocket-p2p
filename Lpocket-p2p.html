<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pocket P2P Messenger</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  color-scheme:light;
  --bg:#f3f4f7;
  --panel:#fff;
  --line:#e5e6eb;
  --text:#24262d;
  --muted:#8a8e99;
  --soft:#f0f1f4;
  --accent:#70727b;
  --icon:#858892;
  --green:#55b879;
  --bubble:#eceef1;
  --input:#f6f6f8;
}

@media(prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --bg:#17181c;
    --panel:#202126;
    --line:#34353d;
    --text:#f0f0f4;
    --muted:#9b9da8;
    --soft:#2b2c33;
    --accent:#c7b8ff;
    --icon:#c7b8ff;
    --green:#68c98c;
    --bubble:#303139;
    --input:#2a2b31;
  }
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Pretendard",
    "Segoe UI",
    sans-serif;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:min(760px,100%);
  height:100dvh;
  margin:auto;
  background:var(--panel);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  box-shadow:0 0 40px rgba(0,0,0,.06);
}

/* =========================
   상단
========================= */

.top{
  padding:18px 20px 14px;
  border-bottom:1px solid var(--line);
  background:var(--panel);
  z-index:2;
}

.topline{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  width:38px;
  height:38px;
  border-radius:13px;
  background:var(--accent);
  color:var(--panel);
  display:grid;
  place-items:center;
  font-weight:800;
  font-size:17px;
}

.title{
  font-size:17px;
  font-weight:750;
  letter-spacing:-.3px;
}

.sub{
  font-size:11px;
  color:var(--muted);
  margin-top:2px;
}

.connection{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:11px;
  color:var(--muted);
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#c7cbd2;
}

.dot.on{
  background:var(--green);
}

/* =========================
   채팅
========================= */

.roombar{
  display:none;
  padding:9px 18px;
  border-bottom:1px solid var(--line);
  background:var(--panel);
  font-size:11px;
  color:var(--muted);
}

.roombar b{
  color:var(--text);
  font-weight:700;
}

.chat{
  flex:1;
  min-height:0;
  overflow:auto;
  padding:20px 18px 16px;
  display:flex;
  flex-direction:column;
  gap:8px;
  background:var(--panel);
}

.empty{
  margin:auto;
  text-align:center;
  color:var(--muted);
}

.emptyIcon{
  width:54px;
  height:54px;
  margin:0 auto 12px;
  border-radius:18px;
  background:var(--soft);
  display:grid;
  place-items:center;
  font-size:23px;
  color:var(--icon);
}

.empty strong{
  display:block;
  color:var(--text);
  font-size:14px;
  margin-bottom:4px;
}

.empty span{
  font-size:11px;
}

.msg{
  max-width:min(72%,500px);
  padding:10px 12px;
  border-radius:16px;
  font-size:14px;
  line-height:1.45;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.me{
  align-self:flex-end;
  background:var(--accent);
  color:var(--panel);
  border-bottom-right-radius:5px;
}

.them{
  align-self:flex-start;
  background:var(--bubble);
  color:var(--text);
  border-bottom-left-radius:5px;
}

.msgName{
  font-size:10px;
  font-weight:700;
  opacity:.62;
  margin-bottom:3px;
}

.log{
  text-align:center;
  font-size:10px;
  color:var(--muted);
  padding:4px;
}

/* =========================
   파일
========================= */

.file{
  display:flex;
  gap:8px;
  align-items:center;
  min-width:190px;
}

.fileIcon{
  width:34px;
  height:34px;
  border-radius:10px;
  background:rgba(128,128,128,.16);
  display:grid;
  place-items:center;
  flex:none;
  color:var(--icon);
}

.fileInfo{
  min-width:0;
}

.fileName{
  font-weight:650;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.fileSize{
  font-size:10px;
  opacity:.62;
  margin-top:2px;
}

.file a{
  color:inherit;
  text-decoration:none;
}

.progress{
  height:3px;
  background:rgba(128,128,128,.18);
  border-radius:99px;
  margin-top:7px;
  overflow:hidden;
}

.progress i{
  display:block;
  height:100%;
  width:0;
  background:currentColor;
}

/* =========================
   입력창
========================= */

.composer{
  padding:10px 12px 7px;
  border-top:1px solid var(--line);
  background:var(--panel);
  display:flex;
  gap:7px;
}

.messageBox{
  flex:1;
  min-width:0;
  border:1px solid var(--line);
  background:var(--input);
  border-radius:14px;
  display:flex;
  align-items:center;
  padding:3px 4px 3px 12px;
}

.messageBox input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  padding:9px 4px;
  font-size:14px;
}

.iconBtn{
  width:38px;
  height:38px;
  border:0;
  border-radius:11px;
  background:transparent;
  color:var(--icon);
  font-size:20px;
}

.send{
  width:38px;
  height:38px;
  border:0;
  border-radius:11px;
  background:var(--accent);
  color:var(--panel);
  font-size:15px;
  font-weight:700;
}

#fileInput{
  display:none;
}

/* =========================
   하단 메뉴
========================= */

.bottomNav{
  height:72px;
  padding:6px 12px calc(6px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);
  background:var(--panel);
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  flex:none;
}

.navBtn{
  border:0;
  background:transparent;
  color:var(--icon);
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  font-size:12px;
  font-weight:700;
}

.navBtn:active{
  background:var(--soft);
}

.navIcon{
  font-size:21px;
  line-height:1;
}

/* =========================
   오버레이 / 시트
========================= */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.38);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:20;
}

.sheet{
  width:min(760px,100%);
  background:var(--panel);
  border-radius:22px 22px 0 0;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  max-height:80dvh;
  overflow:auto;
}

.sheet h2{
  font-size:17px;
  margin:0 0 14px;
}

.sheetClose{
  float:right;
  border:0;
  background:var(--soft);
  color:var(--icon);
  width:34px;
  height:34px;
  border-radius:11px;
}

.sheet .field{
  display:flex;
  align-items:center;
  background:var(--input);
  border:1px solid var(--line);
  border-radius:13px;
  padding:4px;
}

.sheet .field input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  padding:10px 11px;
  font-size:14px;
}

.sheet .btn{
  border:0;
  border-radius:11px;
  padding:10px 13px;
  font-weight:700;
  font-size:13px;
}

.dark{
  background:var(--accent);
  color:var(--panel);
}

.light{
  background:var(--soft);
  color:var(--text);
}

.joinrow{
  display:flex;
  gap:7px;
  margin-top:8px;
}

.joinrow .field{
  flex:1;
}

.hint{
  font-size:10.5px;
  color:var(--muted);
  line-height:1.45;
  margin:8px 3px 0;
}

/* =========================
   온라인 방
========================= */

.sheetList{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.roomCard{
  border:1px solid var(--line);
  background:var(--input);
  border-radius:13px;
  padding:11px;
  cursor:pointer;
}

.roomCard:active{
  background:var(--soft);
}

.roomName{
  font-size:13px;
  font-weight:700;
}

.roomMeta{
  font-size:10px;
  color:var(--muted);
  margin-top:3px;
}

.emptyRooms{
  font-size:10.5px;
  color:var(--muted);
  padding:10px 2px;
}

.roomsHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}

.roomsTitle{
  font-size:12px;
  font-weight:750;
}

.roomsState{
  font-size:10px;
  color:var(--muted);
}

/* =========================
   프로필
========================= */

.profileOverlay{
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.profileCard{
  width:min(430px,100%);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:22px;
  padding:20px;
}

.profileCard h2{
  margin:0;
  font-size:20px;
}

.profileCard p{
  margin:6px 0 16px;
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
}

.avatarRow{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:12px;
}

.avatar{
  width:58px;
  height:58px;
  flex:none;
  border-radius:18px;
  object-fit:cover;
  background:var(--soft);
  display:grid;
  place-items:center;
  color:var(--icon);
  font-size:26px;
  overflow:hidden;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profileCard .field{
  display:flex;
  align-items:center;
  background:var(--input);
  border:1px solid var(--line);
  border-radius:13px;
  padding:4px;
}

.profileCard .field input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  padding:10px 11px;
  font-size:14px;
}

.profileCard .btn{
  border:0;
  border-radius:11px;
  padding:10px 13px;
  font-weight:700;
  font-size:13px;
}

.profileSave{
  display:flex;
  align-items:center;
  gap:8px;
  margin:13px 2px;
  font-size:12px;
  color:var(--muted);
}

.profileSave input{
  accent-color:var(--accent);
}

#avatarInput{
  display:none;
}

#profileStart{
  width:100%;
  margin-top:3px;
}

/* =========================
   모바일
========================= */

@media(max-width:600px){

  .app{
    box-shadow:none;
  }

  .top{
    padding-top:
      calc(14px + env(safe-area-inset-top));
  }

  .msg{
    max-width:84%;
  }

}
</style>
</head>

<body>

<div class="app">

  <!-- 상단 -->
  <header class="top">

    <div class="topline">

      <div class="brand">

        <div class="logo">P</div>

        <div>
          <div class="title">Pocket P2P</div>
          <div class="sub">
            online · private · direct
          </div>
        </div>

      </div>

      <div class="connection">
        <i class="dot" id="dot"></i>
        <span id="status">대기 중</span>
      </div>

    </div>

  </header>


  <!-- 현재 방 -->
  <div class="roombar" id="roomBar">
    현재 방 ·
    <b id="roomLabel"></b>
  </div>


  <!-- 채팅 -->
  <main class="chat" id="chat">

    <div class="empty" id="empty">

      <div class="emptyIcon">✦</div>

      <strong>
        아직 연결되지 않았어요
      </strong>

      <span>
        아래 메뉴에서 방을 만들거나
        온라인 방을 찾아보세요.
      </span>

    </div>

  </main>


  <!-- 메시지 입력 -->
  <footer class="composer">

    <input
      id="fileInput"
      type="file"
    >

    <div class="messageBox">

      <button
        class="iconBtn"
        id="fileBtn"
        title="파일 보내기"
        disabled
      >
        ＋
      </button>

      <input
        id="message"
        placeholder="메시지를 입력하세요"
        disabled
      >

      <button
        class="send"
        id="sendBtn"
        disabled
      >
        ↑
      </button>

    </div>

  </footer>


  <!-- 하단 메뉴 -->
  <nav class="bottomNav">

    <button
      class="navBtn"
      id="roomMenuBtn"
    >
      <span class="navIcon">🔑</span>
      <span>방 만들기 / 입장하기</span>
    </button>

    <button
      class="navBtn"
      id="onlineMenuBtn"
    >
      <span class="navIcon">🌐</span>
      <span>온라인 방</span>
    </button>

  </nav>

</div>


<!-- =========================
     방 만들기 / 입장
========================= -->

<div
  class="overlay"
  id="roomOverlay"
>

  <section class="sheet">

    <button
      class="sheetClose"
      data-close="roomOverlay"
    >
      ×
    </button>

    <h2>
      방 만들기 / 입장하기
    </h2>

    <div class="field">

      <input
        id="roomName"
        maxlength="50"
        placeholder="새 방 이름"
      >

      <button
        class="btn dark"
        id="createBtn"
      >
        만들기
      </button>

    </div>


    <div class="joinrow">

      <div class="field">

        <input
          id="joinName"
          maxlength="50"
          placeholder="방 이름으로 입장"
        >

      </div>

      <button
        class="btn light"
        id="joinBtn"
      >
        입장
      </button>

    </div>


    <div class="hint">
      방 이름은 3~50자의 영문, 숫자,
      - 또는 _를 사용하세요.
    </div>

  </section>

</div>


<!-- =========================
     온라인 방
========================= -->

<div
  class="overlay"
  id="onlineOverlay"
>

  <section class="sheet">

    <button
      class="sheetClose"
      data-close="onlineOverlay"
    >
      ×
    </button>

    <div class="roomsHead">

      <div class="roomsTitle">
        온라인 방
      </div>

      <div
        class="roomsState"
        id="roomsState"
      >
        불러오는 중…
      </div>

    </div>

    <div
      class="sheetList"
      id="roomList"
    >
      <div class="emptyRooms">
        온라인 방을 찾는 중…
      </div>
    </div>

  </section>

</div>


<!-- =========================
     프로필
========================= -->

<div
  class="overlay profileOverlay"
  id="profileOverlay"
>

  <section class="profileCard">

    <h2>
      프로필 만들기
    </h2>

    <p>
      채팅에서 표시할 이름과
      프로필을 정해주세요.
    </p>


    <div class="avatarRow">

      <div
        class="avatar"
        id="avatarPreview"
      >
        ☺
      </div>


      <button
        class="btn light"
        id="avatarBtn"
      >
        프로필 이미지 선택
      </button>

      <input
        id="avatarInput"
        type="file"
        accept="image/*"
      >

    </div>


    <div class="field">

      <input
        id="nickname"
        maxlength="30"
        placeholder="닉네임"
      >

    </div>


    <label class="profileSave">

      <input
        id="saveProfile"
        type="checkbox"
      >

      이 프로필 저장하기

    </label>


    <button
      class="btn dark"
      id="profileStart"
    >
      시작하기
    </button>

  </section>

</div>


<script>

/* =========================================================
   1. SUPABASE 설정
========================================================= */

const SUPABASE_URL =
  "https://vhpgssmhbjjzfaqeiprf.supabase.co";

/*
  여기에 Supabase의 Publishable key를 넣으세요.

  예:
  const SUPABASE_PUBLISHABLE_KEY = "eyJ...";
*/

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_d5oY02qCY0soSDhNMZND-w_8dulDA4-";


/* =========================================================
   2. Supabase 시작
========================================================= */

const {
  createClient
} = supabase;

let sb = null;

try{

  if(
    SUPABASE_PUBLISHABLE_KEY &&
    !SUPABASE_PUBLISHABLE_KEY.includes(
      "PASTE_YOUR"
    )
  ){

    sb = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

  }

}catch(error){

  console.error(
    "Supabase 초기화 오류:",
    error
  );

}


/* =========================================================
   3. 기본 상태
========================================================= */

const $ =
  id => document.getElementById(id);


const clientId =
  (
    crypto.randomUUID
      ? crypto.randomUUID()
      : (
          Date.now().toString(36) +
          Math.random()
            .toString(36)
            .slice(2)
        )
  );


const validRoom =
  s =>
    /^[A-Za-z0-9_-]{3,50}$/
      .test(s.trim());


let lobby = null;
let roomChannel = null;

let currentRoom = "";

let isHost = false;

let pc = null;
let dataChannel = null;

let pendingCandidates = [];

let remoteDescriptionReady =
  false;

let incoming =
  new Map();

let remoteProfile = {
  nickname:"상대방",
  avatar:""
};

let lobbyRooms =
  new Map();

let lobbyJoined =
  false;


/* =========================================================
   4. 프로필
========================================================= */

let profile = null;
let pendingAvatar = "";


function loadProfile(){

  try{

    const saved =
      localStorage.getItem(
        "pocket_p2p_profile"
      );

    if(saved){

      return JSON.parse(saved);

    }

  }catch(error){

    console.warn(
      "프로필 불러오기 실패:",
      error
    );

  }

  return null;

}


function finishProfile(){

  const nickname =
    $("nickname")
      .value
      .trim();


  profile = {

    nickname:
      nickname ||
      (
        "Guest-" +
        Math.floor(
          1000 +
          Math.random() * 9000
        )
      ),

    avatar:
      pendingAvatar || ""

  };


  /*
    저장 체크를 했으면 저장.
    안 했으면 저장하지 않음.
  */

  if(
    $("saveProfile").checked
  ){

    try{

      localStorage.setItem(
        "pocket_p2p_profile",
        JSON.stringify(profile)
      );

    }catch(error){

      console.warn(
        "프로필 저장 실패:",
        error
      );

    }

  }else{

    try{

      localStorage.removeItem(
        "pocket_p2p_profile"
      );

    }catch(error){}

  }


  $("profileOverlay").style.display =
    "none";


  status(
    "서버 연결 중…"
  );


  startLobby();

}


/* 프로필 이미지 버튼 */

$("avatarBtn")
  .addEventListener(
    "click",
    function(){

      $("avatarInput").click();

    }
  );


/* 이미지 선택 */

$("avatarInput")
  .addEventListener(
    "change",
    function(){

      const file =
        this.files &&
        this.files[0];


      if(!file)
        return;


      if(
        !file.type.startsWith(
          "image/"
        )
      ){

        alert(
          "이미지 파일만 선택할 수 있어요."
        );

        this.value = "";

        return;

      }


      const reader =
        new FileReader();


      reader.onload =
        function(){

          pendingAvatar =
            reader.result;


          $("avatarPreview")
            .innerHTML = "";


          const img =
            document.createElement(
              "img"
            );


          img.src =
            pendingAvatar;

          img.alt =
            "프로필 이미지";


          $("avatarPreview")
            .appendChild(img);

        };


      reader.onerror =
        function(){

          alert(
            "이미지를 불러오지 못했어요."
          );

        };


      reader.readAsDataURL(
        file
      );

    }
  );


$("profileStart")
  .addEventListener(
    "click",

function bytes(n){

  if(n < 1024)
    return n + " B";

  if(n < 1048576)
    return (
      n / 1024
    ).toFixed(1)
    + " KB";

  if(n < 1073741824)
    return (
      n / 1048576
    ).toFixed(1)
    + " MB";

  return (
    n / 1073741824
  ).toFixed(1)
  + " GB";

}

async function startLobby(){

  if(lobbyJoined)
    return;


  if(!sb){

    status(
      "Publishable key 필요"
    );

    $("roomsState")
      .textContent =
      "키 필요";

    $("roomList")
      .innerHTML =
      `
      <div class="emptyRooms">
        HTML 코드의<br>
        SUPABASE_PUBLISHABLE_KEY에<br>
        Supabase Publishable key를 넣어주세요.
      </div>
      `;

    return;

  }


  try{

    lobby =
      sb.channel(
        "pocket-p2p-lobby",
        {
          config:{
            presence:{
              key:clientId
            }
          }
        }
      );


    lobby.on(
      "presence",
      {
        event:"sync"
      },
      renderLobby
    );


    lobby.on(
      "presence",
      {
        event:"join"
      },
      renderLobby
    );


    lobby.on(
      "presence",
      {
        event:"leave"
      },
      renderLobby
    );


    const result =
      await new Promise(
        resolve =>
          lobby.subscribe(
            resolve
          )
      );


    if(
      result !==
      "SUBSCRIBED"
    ){

      throw new Error(
        "SUPABASE_SUBSCRIBE_FAILED"
      );

    }


    lobbyJoined =
      true;


    status(
      "온라인",
      true
    );


    $("roomsState")
      .textContent =
      "실시간";


    renderLobby();


  }catch(error){

    console.error(
      error
    );

    status(
      "서버 연결 실패"
    );


    $("roomsState")
      .textContent =
      "연결 실패";


    $("roomList")
      .innerHTML =
      `
      <div class="emptyRooms">
        Supabase 서버에 연결하지 못했어요.
      </div>
      `;

  }

}


function renderLobby(){

  if(!lobby)
    return;


  const state =
    lobby.presenceState();


  const map =
    new Map();


  for(
    const key in state
  ){

    for(
      const p of state[key]
    ){

      if(
        p.type !==
        "room"
      )
        continue;


      if(
        !map.has(
          p.room
        )
      ){

        map.set(
          p.room,
          {
            room:p.room,
            count:0,
            host:p.host || key
          }
        );

      }


      map.get(
        p.room
      ).count++;

    }

  }


  lobbyRooms =
    map;


  const list =
    $("roomList");


  list.innerHTML =
    "";


  if(
    !map.size
  ){

    list.innerHTML =
      `
      <div class="emptyRooms">
        현재 온라인인 방이 없어요.<br>
        방을 하나 만들어보세요.
      </div>
      `;

    $("roomsState")
      .textContent =
      "0개";

    return;

  }


  $("roomsState")
    .textContent =
    map.size + "개";


  [
    ...map.values()
  ]
  .sort(
    (a,b) =>
      a.room.localeCompare(
        b.room
      )
  )
  .forEach(
    r => {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "roomCard";


      card.onclick =
        function(){

          joinRoom(
            r.room
          );

          $("onlineOverlay")
            .style.display =
            "none";

        };


      const name =
        document.createElement(
          "div"
        );

      name.className =
        "roomName";

      name.textContent =
        r.room;


      const meta =
        document.createElement(
          "div"
        );

      meta.className =
        "roomMeta";

      meta.textContent =
        "인원 " +
        Math.min(
          r.count,
          2
        ) +
        " / 2 · 입장 →";


      card.append(
        name,
        meta
      );


      list.appendChild(
        card
      );

    }
  );

}

/* =========================================================
   7. WebRTC
========================================================= */

function makePC(){

  if(pc){

    try{
      pc.close();
    }catch(error){}

  }


  pc =
    new RTCPeerConnection({

      iceServers:[
        {
          urls:
            "stun:stun.l.google.com:19302"
        }
      ]

    });


  pc.onicecandidate =
    function(e){

      if(
        e.candidate
      ){

        sendSignal(
          "ice",
          {
            candidate:
              e.candidate
          }
        );

      }

    };


  pc.onconnectionstatechange =
    function(){

      const s =
        pc.connectionState;


      if(
        s ===
        "connected"
      ){

        status(
          "P2P 연결됨",
          true
        );

        enable(true);

        log(
          "상대방과 직접 연결되었습니다."
        );

      }


      if(
        s === "disconnected" ||
        s === "failed" ||
        s === "closed"
      ){

        enable(false);

        status(
          "P2P 연결 종료"
        );

      }

    };


  pc.ondatachannel =
    function(e){

      setupDataChannel(
        e.channel
      );

    };


  return pc;

}


function setupDataChannel(
  ch
){

  dataChannel =
    ch;


  ch.binaryType =
    "arraybuffer";


  ch.onopen =
    function(){

      enable(true);

      status(
        "P2P 연결됨",
        true
      );

      sendProfile();

    };


  ch.onclose =
    function(){

      enable(false);

      status(
        "P2P 연결 종료"
      );

    };


  ch.onerror =
    function(){

      log(
        "데이터 연결에 오류가 발생했습니다."
      );

    };


  ch.onmessage =
    handleData;

}


function sendProfile(){

  if(
    dataChannel &&
    dataChannel.readyState ===
      "open"
  ){

    dataChannel.send(
      JSON.stringify({
        type:"profile",
        profile
      })
    );

  }

}


function handleData(e){

  if(
    typeof e.data ===
    "string"
  ){

    let data;


    try{

      data =
        JSON.parse(
          e.data
        );

    }catch(error){

      return;

    }


    if(
      data.type ===
      "profile"
    ){

      remoteProfile =
        data.profile ||
        remoteProfile;

      return;

    }


    if(
      data.type ===
      "msg"
    ){

      message(
        data.text,
        false,
        remoteProfile.nickname
      );

      return;

    }


    if(
      data.type ===
      "file-start"
    ){

      incoming.set(
        data.id,
        {
          name:data.name,
          size:data.size,
          chunks:[],
          got:0,
          total:data.total
        }
      );


      log(
        "파일 수신 중 · " +
        data.name
      );


      return;

    }


    if(
      data.type ===
      "file-end"
    ){

      finishIncoming(
        data.id
      );

      return;

    }

  }


  if(
    e.data instanceof
    ArrayBuffer
  ){

    const view =
      new Uint8Array(
        e.data
      );


    if(
      view.byteLength <
      37
    )
      return;


    const idBytes =
      view.slice(
        0,
        36
      );


    const id =
      new TextDecoder()
        .decode(
          idBytes
        );


    const f =
      incoming.get(
        id
      );


    if(!f)
      return;


    f.chunks.push(
      view
        .slice(36)
        .buffer
    );


    f.got++;


    if(
      f.got >=
      f.total
    ){

      finishIncoming(
        id
      );

    }

  }

}


function finishIncoming(
  id
){

  const f =
    incoming.get(id);


  if(!f)
    return;


  const url =
    URL.createObjectURL(
      new Blob(
        f.chunks
      )
    );


  clearEmpty();


  const d =
    document.createElement(
      "div"
    );

  d.className =
    "msg them";


  const a =
    document.createElement(
      "a"
    );


  a.href =
    url;

  a.download =
    f.name;


  a.innerHTML =
    `
    <div class="file">

      <div class="fileIcon">
        ↓
      </div>

      <div class="fileInfo">

        <div class="fileName"></div>

        <div class="fileSize"></div>

      </div>

    </div>
    `;


  a.querySelector(
    ".fileName"
  ).textContent =
    f.name;


  a.querySelector(
    ".fileSize"
  ).textContent =
    bytes(f.size);


  d.appendChild(a);


  $("chat")
    .appendChild(d);


  $("chat")
    .scrollTop =
    999999;


  incoming.delete(
    id
  );

}


async function sendSignal(
  event,
  data
){

  if(!roomChannel)
    return;


  await roomChannel.send({

    type:"broadcast",

    event,

    payload:{
      from:clientId,
      ...data
    }

  });

}


async function flushCandidates(){

  if(
    !remoteDescriptionReady ||
    !pc
  )
    return;


  for(
    const c of pendingCandidates
  ){

    try{

      await pc.addIceCandidate(
        c
      );

    }catch(error){}

  }


  pendingCandidates =
    [];

}


/* =========================================================
   8. 방 채널
========================================================= */

async function setupRoomChannel(
  room,
  host
){

  roomChannel =
    sb.channel(
      "pocket-p2p-room:" +
      room,
      {
        config:{
          presence:{
            key:clientId
          },
          broadcast:{
            self:false,
            ack:true
          }
        }
      }
    );


  /* OFFER */

  roomChannel.on(
    "broadcast",
    {
      event:"offer"
    },
    async function({
      payload
    }){

      if(
        payload.to &&
        payload.to !==
        clientId
      )
        return;


      if(isHost)
        return;


      makePC();


      await pc.setRemoteDescription(
        payload.sdp
      );


      remoteDescriptionReady =
        true;


      await flushCandidates();


      const answer =
        await pc.createAnswer();


      await pc.setLocalDescription(
        answer
      );


      await sendSignal(
        "answer",
        {
          to:payload.from,
          sdp:pc.localDescription
        }
      );

    }
  );


  /* ANSWER */

  roomChannel.on(
    "broadcast",
    {
      event:"answer"
    },
    async function({
      payload
    }){

      if(
        payload.to &&
        payload.to !==
        clientId
      )
        return;


      if(
        !isHost ||
        !pc
      )
        return;


      await pc.setRemoteDescription(
        payload.sdp
      );


      remoteDescriptionReady =
        true;


      await flushCandidates();

    }
  );


  /* ICE */

  roomChannel.on(
    "broadcast",
    {
      event:"ice"
    },
    async function({
      payload
    }){

      if(
        payload.to &&
        payload.to !==
        clientId
      )
        return;


      if(
        !payload.candidate
      )
        return;


      if(
        !pc ||
        !remoteDescriptionReady
      ){

        pendingCandidates.push(
          payload.candidate
        );

        return;

      }


      try{

        await pc.addIceCandidate(
          payload.candidate
        );

      }catch(error){}

    }
  );


  /* PRESENCE SYNC */

  roomChannel.on(
    "presence",
    {
      event:"sync"
    },
    async function(){

      const state =
        roomChannel.presenceState();


      const peers =
        [];


      for(
        const key in state
      ){

        for(
          const p of state[key]
        ){

          if(
            p.clientId &&
            p.clientId !==
            clientId
          ){

            peers.push(p);

          }

        }

      }


      if(
        peers.length > 1
      ){

        log(
          "이 방은 1:1 방이라 더 이상 입장할 수 없습니다."
        );

        return;

      }


      if(
        isHost &&
        peers.length === 1 &&
        !pc
      ){

        await createOffer(
          peers[0].clientId
        );

      }


      updateRoomCount(
        peers.length + 1
      );

    }
  );


  /* PRESENCE JOIN */

  roomChannel.on(
    "presence",
    {
      event:"join"
    },
    async function({
      newPresences
    }){

      const p =
        newPresences.find(
          x =>
            x.clientId !==
            clientId
        );


      if(
        p &&
        isHost &&
        !pc
      ){

        await createOffer(
          p.clientId
        );

      }


      updateRoomCount(
        roomChannel.presenceState()
      );

    }
  );


  /* PRESENCE LEAVE */

  roomChannel.on(
    "presence",
    {
      event:"leave"
    },
    function(){

      updateRoomCount(
        roomChannel.presenceState()
      );

    }
  );


  const st =
    await new Promise(
      resolve =>
        roomChannel.subscribe(
          resolve
        )
    );


  if(
    st !==
    "SUBSCRIBED"
  ){

    throw new Error(
      "ROOM_SUBSCRIBE_FAILED"
    );

  }


  await roomChannel.track({

    clientId,

    role:
      host
        ? "host"
        : "guest",

    joined_at:
      Date.now()

  });


  updateRoomCount(
    roomChannel.presenceState()
  );

}


async function createOffer(
  target
){

  makePC();


  setupDataChannel(
    pc.createDataChannel(
      "data",
      {
        ordered:true
      }
    )
  );


  const offer =
    await pc.createOffer();


  await pc.setLocalDescription(
    offer
  );


  await sendSignal(
    "offer",
    {
      to:target,
      sdp:pc.localDescription
    }
  );

}


function updateRoomCount(
  state
){

  let n = 0;


  if(
    Array.isArray(state)
  ){

    n =
      state.length;

  }else{

    for(
      const k in state
    ){

      n +=
        state[k].length;

    }

  }


  $("roomLabel")
    .textContent =
      currentRoom +
      "  ·  " +
      Math.min(
        n,
        2
      ) +
      "/2";

}


/* =========================================================
   9. 방 정리
========================================================= */

async function cleanupRoom(){

  enable(false);

  await leaveLobbyRoom();


  remoteDescriptionReady =
    false;


  pendingCandidates =
    [];


  incoming.clear();


  if(pc){

    try{
      pc.close();
    }catch(error){}

    pc = null;

  }


  dataChannel =
    null;


  if(roomChannel){

    try{
      await roomChannel.untrack();
    }catch(error){}


    try{
      await sb.removeChannel(
        roomChannel
      );
    }catch(error){}


    roomChannel =
      null;

  }


  if(currentRoom){

    currentRoom =
      "";

    $("roomBar")
      .style.display =
      "none";

  }

}


/* =========================================================
   10. 방 만들기
========================================================= */

async function createRoom(){

  const room =
    $("roomName")
      .value
      .trim()
      .replace(
        /\s+/g,
        "-"
      );


  if(
    !validRoom(room)
  ){

    log(
      "방 이름은 3~50자의 영문, 숫자, - 또는 _를 사용하세요."
    );

    return;

  }


  if(
    lobbyRooms.has(room)
  ){

    log(
      "이미 온라인인 방입니다. 다른 방 이름을 사용하세요."
    );

    return;

  }


  await cleanupRoom();


  currentRoom =
    room;


  isHost =
    true;


  $("roomBar")
    .style.display =
    "block";


  $("roomLabel")
    .textContent =
    room +
    "  ·  1/2";


  status(
    "방 만드는 중…"
  );


  try{

    await publishLobbyRoom(
      room
    );


    await setupRoomChannel(
      room,
      true
    );


    log(
      "방이 만들어졌습니다."
    );


    log(
      "친구가 온라인 방 목록에서 찾을 수 있어요."
    );


    status(
      "상대방 대기 중",
      true
    );


    $("roomName")
      .value =
      "";


  }catch(error){

    console.error(
      error
    );


    log(
      "방 생성 실패: " +
      error.message
    );


    await cleanupRoom();


    status(
      "오류"
    );

  }

}


/* =========================================================
   11. 방 입장
========================================================= */

async function joinRoom(
  roomFromCard = null
){

  const room =
    roomFromCard ||
    $("joinName")
      .value
      .trim()
      .replace(
        /\s+/g,
        "-"
      );


  if(
    !validRoom(room)
  ){

    log(
      "방 이름은 3~50자의 영문, 숫자, - 또는 _를 사용하세요."
    );

    return;

  }


  /*
    온라인 목록에서 선택한 경우는
    이미 존재하는 방이므로 허용.
    직접 입력한 경우에는 현재 온라인 방만 허용.
  */

  if(
    !roomFromCard &&
    !lobbyRooms.has(room)
  ){

    log(
      "현재 온라인 방 목록에 없는 방입니다."
    );

    return;

  }


  await cleanupRoom();


  currentRoom =
    room;


  isHost =
    false;


  $("roomBar")
    .style.display =
    "block";


  $("roomLabel")
    .textContent =
    room +
    "  ·  입장 중";


  status(
    "방 입장 중…"
  );


  try{

    await setupRoomChannel(
      room,
      false
    );


    const state =
      roomChannel
        .presenceState();


    let n = 0;


    for(
      const k in state
    ){

      n +=
        state[k].length;

    }


    if(
      n > 2
    ){

      log(
        "이 방은 이미 가득 찼습니다."
      );


      await cleanupRoom();


      status(
        "입장 실패"
      );


      return;

    }


    await publishLobbyRoom(
      room
    );


    log(
      "방에 입장했습니다."
    );


    log(
      "상대방과 연결하는 중…"
    );


    $("joinName")
      .value =
      "";


  }catch(error){

    console.error(
      error
    );


    log(
      "입장 실패: " +
      error.message
    );


    await cleanupRoom();


    status(
      "오류"
    );

  }

}


/* =========================================================
   12. 메시지
========================================================= */

function send(){

  const t =
    $("message")
      .value
      .trim();


  if(
    !t ||
    !dataChannel ||
    dataChannel.readyState !==
      "open"
  )
    return;


  dataChannel.send(
    JSON.stringify({
      type:"msg",
      text:t
    })
  );


  message(
    t,
    true
  );


  $("message")
    .value =
    "";

}


/* =========================================================
   13. 파일 전송
========================================================= */

$("fileBtn")
  .addEventListener(
    "click",
    function(){

      $("fileInput")
        .click();

    }
  );


$("fileInput")
  .addEventListener(
    "change",
    async function(){

      const f =
        this.files &&
        this.files[0];


      if(
        !f ||
        !dataChannel ||
        dataChannel.readyState !==
          "open"
      )
        return;


      const id =
        crypto.randomUUID();


      const idBytes =
        new TextEncoder()
          .encode(id);


      const chunkSize =
        48 * 1024;


      const total =
        Math.ceil(
          f.size /
          chunkSize
        );


      dataChannel.send(
        JSON.stringify({

          type:"file-start",

          id,

          name:f.name,

          size:f.size,

          total

        })
      );


      clearEmpty();


      const d =
        document.createElement(
          "div"
        );


      d.className =
        "msg me";


      d.innerHTML =
        `
        <div class="file">

          <div class="fileIcon">
            ↑
          </div>

          <div class="fileInfo">

            <div class="fileName"></div>

            <div class="fileSize"></div>

            <div class="progress">
              <i></i>
            </div>

          </div>

        </div>
        `;


      d.querySelector(
        ".fileName"
      ).textContent =
      f.name;


      d.querySelector(
        ".fileSize"
      ).textContent =
      bytes(f.size);


      $("chat")
        .appendChild(d);


      $("chat")
        .scrollTop =
        999999;


      const bar =
        d.querySelector(
          ".progress i"
        );


      for(
        let n = 0;
        n < total;
        n++
      ){

        const buf =
          await f
            .slice(
              n * chunkSize,
              Math.min(
                f.size,
                (n + 1) *
                chunkSize
              )
            )
            .arrayBuffer();


        const packet =
          new Uint8Array(
            36 +
            buf.byteLength
          );


        packet.set(
          idBytes,
          0
        );


        packet.set(
          new Uint8Array(buf),
          36
        );


        while(
          dataChannel.bufferedAmount >
          4 * 1024 * 1024
        ){

          await new Promise(
            resolve =>
              setTimeout(
                resolve,
                25
              )
          );

        }


        dataChannel.send(
          packet.buffer
        );


        bar.style.width =
          (
            (n + 1) /
            total *
            100
          ) +
          "%";

      }


      dataChannel.send(
        JSON.stringify({
          type:"file-end",
          id
        })
      );


      $("fileInput")
        .value =
        "";

    }
  );
