<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Pocket P2P Messenger</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans KR",
    sans-serif;
}

body {
  background: #f6f6f8;
  color: #222;
}

button,
input {
  font: inherit;
}

button {
  border: 0;
  cursor: pointer;
}

.app {
  width: 100%;
  height: 100dvh;
  display: flex;
  flex-direction: column;
}

/* =========================
   PROFILE
========================= */

.profileOverlay {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(0,0,0,.45);
}

.profileCard {
  width: min(420px, 100%);
  padding: 28px;
  border-radius: 24px;
  background: white;
  box-shadow: 0 20px 60px rgba(0,0,0,.2);
}

.profileCard h1 {
  margin: 0 0 8px;
  font-size: 25px;
}

.profileCard p {
  margin: 0 0 22px;
  color: #777;
}

.avatarButton {
  width: 96px;
  height: 96px;
  margin: 0 auto 20px;
  display: block;
  border-radius: 50%;
  overflow: hidden;
  background: #eee;
  border: 2px solid #ddd;
}

.avatarButton img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.avatarPlaceholder {
  width: 100%;
  height: 100%;
  display: grid;
  place-items: center;
  font-size: 38px;
}

.profileInput {
  width: 100%;
  padding: 14px 15px;
  border: 1px solid #ddd;
  border-radius: 13px;
  outline: none;
  background: #fafafa;
}

.profileInput:focus {
  border-color: #999;
}

.saveProfile {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 15px 0;
  color: #666;
}

.startButton {
  width: 100%;
  padding: 14px;
  border-radius: 14px;
  background: #222;
  color: white;
  font-weight: 700;
}

/* =========================
   HEADER
========================= */

.header {
  flex: 0 0 auto;
  height: 64px;
  padding: 0 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(255,255,255,.92);
  border-bottom: 1px solid #e7e7e7;
  backdrop-filter: blur(14px);
}

.roomInfo {
  min-width: 0;
}

.roomName {
  font-weight: 750;
  font-size: 17px;
}

.connectionStatus {
  margin-top: 2px;
  font-size: 12px;
  color: #888;
}

.profileMini {
  display: flex;
  align-items: center;
  gap: 8px;
}

.profileMini img {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  object-fit: cover;
}

.profileMiniName {
  max-width: 100px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 13px;
}

/* =========================
   CHAT
========================= */

.chat {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 16px;
}

.emptyChat {
  height: 100%;
  display: grid;
  place-items: center;
  color: #aaa;
  text-align: center;
}

.message {
  display: flex;
  gap: 9px;
  margin-bottom: 14px;
  align-items: flex-end;
}

.message.mine {
  flex-direction: row-reverse;
}

.messageAvatar {
  width: 34px;
  height: 34px;
  flex: 0 0 34px;
  border-radius: 50%;
  object-fit: cover;
  background: #ddd;
}

.messageBody {
  max-width: min(78%, 520px);
}

.messageName {
  margin-bottom: 4px;
  font-size: 11px;
  color: #888;
}

.message.mine .messageName {
  text-align: right;
}

.bubble {
  padding: 10px 13px;
  border-radius: 17px;
  background: white;
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
  overflow-wrap: anywhere;
}

.mine .bubble {
  background: #ded8ff;
}

/* =========================
   MEDIA
========================= */

.mediaPreview {
  max-width: min(70vw, 360px);
  border-radius: 13px;
  overflow: hidden;
  background: #111;
}

.mediaPreview img {
  display: block;
  max-width: 100%;
  max-height: 420px;
  object-fit: contain;
}

.mediaPreview video {
  display: block;
  width: 100%;
  max-height: 420px;
}

.audioPreview {
  min-width: 240px;
  max-width: 100%;
}

.audioPreview audio {
  width: 100%;
}

.fileCard {
  min-width: 220px;
  max-width: 320px;
}

.fileName {
  font-weight: 650;
  overflow-wrap: anywhere;
}

.fileMeta {
  margin-top: 4px;
  font-size: 11px;
  color: #888;
}

.downloadButton {
  margin-top: 10px;
  padding: 8px 11px;
  border-radius: 10px;
  background: #eee;
}

/* =========================
   COMPOSER
========================= */

.composer {
  flex: 0 0 auto;
  display: flex;
  align-items: flex-end;
  gap: 8px;
  padding: 9px 12px;
  padding-bottom: calc(9px + env(safe-area-inset-bottom));
  background: rgba(255,255,255,.95);
  border-top: 1px solid #e7e7e7;
}

.fileButton {
  width: 42px;
  height: 42px;
  flex: 0 0 42px;
  border-radius: 13px;
  background: #eee;
  font-size: 20px;
}

.messageInput {
  flex: 1;
  min-width: 0;
  max-height: 120px;
  resize: none;
  padding: 11px 13px;
  border: 1px solid #ddd;
  border-radius: 14px;
  outline: none;
  background: #fafafa;
}

.sendButton {
  width: 42px;
  height: 42px;
  flex: 0 0 42px;
  border-radius: 13px;
  background: #222;
  color: white;
  font-size: 18px;
}

/* =========================
   BOTTOM NAV
========================= */

.bottomNav {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  padding-bottom: env(safe-area-inset-bottom);
  background: rgba(255,255,255,.96);
  border-top: 1px solid #e7e7e7;
}

.navButton {
  padding: 10px 5px;
  background: transparent;
  color: #777;
}

.navIcon {
  display: block;
  font-size: 21px;
  line-height: 22px;
  filter: grayscale(1);
}

.navText {
  display: block;
  margin-top: 3px;
  font-size: 10px;
}

/* =========================
   SHEET
========================= */

.sheetOverlay {
  position: fixed;
  inset: 0;
  z-index: 500;
  display: none;
  align-items: flex-end;
  background: rgba(0,0,0,.35);
}

.sheetOverlay.show {
  display: flex;
}

.sheet {
  width: 100%;
  max-height: 80dvh;
  padding: 20px;
  overflow-y: auto;
  border-radius: 24px 24px 0 0;
  background: white;
}

.sheet h2 {
  margin: 0 0 16px;
  font-size: 20px;
}

.sheetInput {
  width: 100%;
  padding: 13px;
  margin-bottom: 9px;
  border: 1px solid #ddd;
  border-radius: 13px;
}

.sheetButton {
  width: 100%;
  padding: 13px;
  margin-bottom: 8px;
  border-radius: 13px;
  background: #222;
  color: white;
}

.onlineRoom {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px;
  margin-bottom: 8px;
  border-radius: 14px;
  background: #f3f3f3;
  text-align: left;
}

.onlineRoomName {
  font-weight: 700;
}

.onlineRoomCount {
  color: #888;
  font-size: 12px;
}

.closeSheet {
  background: #eee;
  color: #333;
}

/* =========================
   DARK MODE
========================= */

@media (prefers-color-scheme: dark) {

  body {
    background: #111;
    color: #eee;
  }

  .header,
  .composer,
  .bottomNav {
    background: rgba(24,24,27,.94);
    border-color: #2d2d31;
  }

  .profileCard,
  .sheet {
    background: #1d1d20;
  }

  .profileCard p,
  .connectionStatus,
  .messageName,
  .fileMeta {
    color: #aaa;
  }

  .profileInput,
  .messageInput {
    background: #29292d;
    border-color: #3a3a3f;
    color: #eee;
  }

  .bubble {
    background: #29292d;
  }

  .mine .bubble {
    background: #514b73;
  }

  .fileButton,
  .downloadButton,
  .closeSheet,
  .onlineRoom {
    background: #2b2b30;
    color: #eee;
  }

  .navButton {
    color: #c8baff;
  }

  .navIcon {
    filter: none;
  }

  .startButton,
  .sheetButton,
  .sendButton {
    background: #eee;
    color: #111;
  }
}

/* =========================
   HIDDEN FILE INPUT
========================= */

#profileImageInput,
#fileInput {
  display: none;
}
</style>
</head>

<body>

<div class="app">

  <!-- PROFILE -->

  <div class="profileOverlay" id="profileOverlay">

    <div class="profileCard">

      <h1>프로필 만들기</h1>
      <p>채팅에서 상대방에게 보여질 프로필이에요.</p>

      <button class="avatarButton" id="avatarButton">
        <div class="avatarPlaceholder" id="avatarPlaceholder">
          👤

        <img id="avatarPreview"
             style="display:none"

      </button>

      <input

      <input

      <label class="saveProfile">

  <!-- HEADER -->

  <header class="header">

      </div>

      <div class="connectionStatus" id="connectionStatus">
        대기 중

    </div>

    <div class="profileMini">

      <img id="myMiniAvatar"
           alt="내 프로필">

      <span
        id="myMiniName"

      </span>

    </div>

  </header>


  <!-- CHAT -->

  <main class="chat" id="chat">

    <div class="emptyChat" id="emptyChat">

        <div style="font-size:35px">💬</div>

      </div>

  </main>


  <!-- COMPOSER -->

  <div class="composer">

    </button>

    <button

      ↑

  <!-- BOTTOM NAV -->

  <nav class="bottomNav">

    <button

    <button

      <span class="navIcon">🌐</span>

</div>


<!-- ROOM SHEET -->

<div
  class="sheetOverlay"
  id="roomSheetOverlay">

  <div class="sheet">

    <h2>방 만들기 / 입장하기</h2>

    <input
      id="roomInput"

    >

    <button

      새 방 만들기

    <button

      방 이름으로 입장
    </button>

    <button

    </button>

  </div>
</div>


<!-- ONLINE ROOMS SHEET -->

<div
  class="sheetOverlay"
  id="onlineRoomsOverlay">

  <div class="sheet">

    <h2>온라인 방</h2>

    <div id="onlineRoomsList">
      불러오는 중...
    </div>

    <button
      class="sheetButton closeSheet"
      id="closeOnlineSheet">
      닫기
    </button>

  </div>
</div>


<script>
/* ============================================================
   SUPABASE
============================================================ */

const SUPABASE_URL =
  "https://vhpgssmhbjjzfaqeiprf.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_d5oY02qCY0soSDhNMZND-w_8dulDA4-";

const { createClient } = supabase;

const sb = createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* ============================================================
   ELEMENTS
============================================================ */

const $ = id => document.getElementById(id);

const profileOverlay = $("profileOverlay");

const avatarButton = $("avatarButton");
const avatarPreview = $("avatarPreview");
const avatarPlaceholder = $("avatarPlaceholder");
const profileImageInput = $("profileImageInput");

const nicknameInput = $("nicknameInput");
const saveProfileCheckbox = $("saveProfileCheckbox");
const startButton = $("startButton");

const myMiniAvatar = $("myMiniAvatar");
const myMiniName = $("myMiniName");

const roomNameEl = $("roomName");
const connectionStatus = $("connectionStatus");

const chat = $("chat");
const emptyChat = $("emptyChat");

const messageInput = $("messageInput");
const sendButton = $("sendButton");

const fileButton = $("fileButton");
const fileInput = $("fileInput");

const roomMenuButton = $("roomMenuButton");
const onlineRoomsButton = $("onlineRoomsButton");

const roomSheetOverlay = $("roomSheetOverlay");
const onlineRoomsOverlay = $("onlineRoomsOverlay");

const roomInput = $("roomInput");

const createRoomButton = $("createRoomButton");
const joinRoomButton = $("joinRoomButton");

const closeRoomSheet = $("closeRoomSheet");
const closeOnlineSheet = $("closeOnlineSheet");

const onlineRoomsList = $("onlineRoomsList");


/* ============================================================
   STATE
============================================================ */

let myProfile = {
  nickname: "",
  avatar: "",
  guest: false
};

let currentRoom = "";
let lobby = null;
let roomChannel = null;

let pc = null;
let dataChannel = null;

let myClientId =
  "client-" +
  Math.random().toString(36).slice(2) +
  Date.now().toString(36);

let remoteProfile = null;

let fileTransfers = new Map();

let pendingIceCandidates = [];

let isInitiator = false;


/* ============================================================
   SAFE RANDOM ID
============================================================ */

function randomId() {

  if (
    typeof crypto !== "undefined" &&
    typeof crypto.randomUUID === "function"
  ) {
    return crypto.randomUUID();
  }

  return (
    Date.now().toString(36) +
    "-" +
    Math.random().toString(36).slice(2)
  );
}


/* ============================================================
   PROFILE IMAGE
============================================================ */

avatarButton.addEventListener("click", () => {
  profileImageInput.click();
});


profileImageInput.addEventListener("change", async event => {

  const file = event.target.files?.[0];

  if (!file) return;

  try {

    const compressed =
      await resizeProfileImage(file);

    myProfile.avatar = compressed;

    avatarPreview.src = compressed;
    avatarPreview.style.display = "block";
    avatarPlaceholder.style.display = "none";

  } catch (error) {

    console.error(error);

    alert("프로필 이미지를 불러오지 못했어요.");

  }

});


function resizeProfileImage(file) {

  return new Promise((resolve, reject) => {

    const reader = new FileReader();

    reader.onload = () => {

      const img = new Image();

      img.onload = () => {

        const size = 256;

        const canvas =
          document.createElement("canvas");

        canvas.width = size;
        canvas.height = size;

        const ctx = canvas.getContext("2d");

        const scale =
          Math.max(
            size / img.width,
            size / img.height
          );

        const width =
          img.width * scale;

        const height =
          img.height * scale;

        const x =
          (size - width) / 2;

        const y =
          (size - height) / 2;

        ctx.drawImage(
          img,
          x,
          y,
          width,
          height
        );

        resolve(
          canvas.toDataURL(
            "image/jpeg",
            0.78
          )
        );

      };

      img.onerror = reject;

      img.src = reader.result;

    };

    reader.onerror = reject;

    reader.readAsDataURL(file);

  });

}


/* ============================================================
   PROFILE
============================================================ */

function loadProfile() {

  try {

    const saved =
      localStorage.getItem(
        "pocket_p2p_profile"
      );

    if (!saved) return false;

    const profile =
      JSON.parse(saved);

    if (!profile.nickname) {
      return false;
    }

    myProfile = {
      nickname: profile.nickname,
      avatar: profile.avatar || "",
      guest: !!profile.guest
    };

    applyMyProfile();

    return true;

  } catch {

    return false;

  }

}


function applyMyProfile() {

  myMiniName.textContent =
    myProfile.nickname;

  if (myProfile.avatar) {

    myMiniAvatar.src =
      myProfile.avatar;

  } else {

    myMiniAvatar.src =
      makeAvatar(myProfile.nickname);

  }

}


function finishProfile() {

  let nickname =
    nicknameInput.value.trim();

  if (!nickname) {

    nickname =
      "Guest-" +
      Math.floor(
        1000 +
        Math.random() * 9000
      );

    myProfile.guest = true;

  } else {

    myProfile.guest = false;

  }

  myProfile.nickname = nickname;

  if (!myProfile.avatar) {
    myProfile.avatar =
      makeAvatar(nickname);
  }

  if (saveProfileCheckbox.checked) {

    localStorage.setItem(
      "pocket_p2p_profile",
      JSON.stringify(myProfile)
    );

  } else {

    localStorage.removeItem(
      "pocket_p2p_profile"
    );

  }

  applyMyProfile();

  profileOverlay.style.display =
    "none";

  startLobby();

}


startButton.addEventListener(
  "click",
  finishProfile
);


/* ============================================================
   SIMPLE AVATAR
============================================================ */

function makeAvatar(name) {

  const letter =
    (name || "?")
      .trim()
      .charAt(0)
      .toUpperCase();

  const svg = `
    <svg xmlns="http://www.w3.org/2000/svg"
         width="256"
         height="256">
      <rect width="256"
            height="256"
            rx="128"
            fill="#d9d9df"/>
      <text x="50%"
            y="54%"
            text-anchor="middle"
            dominant-baseline="middle"
            font-size="120"
            font-family="sans-serif"
            fill="#666">
        ${escapeHtml(letter)}
      </text>
    </svg>
  `;

  return (
    "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(svg)
  );

}


/* ============================================================
   INIT
============================================================ */

(async function init() {

  if (loadProfile()) {

    profileOverlay.style.display =
      "none";

    await startLobby();

  } else {

    profileOverlay.style.display =
      "flex";

  }

})();


/* ============================================================
   LOBBY
============================================================ */

async function startLobby() {

  if (lobby) return;

  lobby =
    sb.channel(
      "pocket-p2p-lobby",
      {
        config: {
          presence: {
            key: myClientId
          }
        }
      }
    );

  lobby.on(
    "presence",
    {
      event: "sync"
    },
    updateOnlineRooms
  );

  lobby.on(
    "presence",
    {
      event: "join"
    },
    updateOnlineRooms
  );

  lobby.on(
    "presence",
    {
      event: "leave"
    },
    updateOnlineRooms
  );

  lobby.subscribe(async status => {

    if (status === "SUBSCRIBED") {

      await lobby.track({
        type: "user",
        clientId: myClientId
      });

      updateOnlineRooms();

    }

  });

}


/* ============================================================
   ONLINE ROOMS
============================================================ */

function getLobbyRooms() {

  if (!lobby) return [];

  const state =
    lobby.presenceState();

  const rooms = [];

  for (const key in state) {

    for (const presence of state[key]) {

      if (
        presence.type === "room" &&
        presence.room
      ) {

        const existing =
          rooms.find(
            r => r.room === presence.room
          );

        if (existing) {

          existing.count++;

        } else {

          rooms.push({
            room: presence.room,
            count: 1
          });

        }

      }

    }

  }

  return rooms;

}


function updateOnlineRooms() {

  const rooms =
    getLobbyRooms();

  if (!rooms.length) {

    onlineRoomsList.innerHTML =
      `<div style="color:#888;padding:15px 0">
        현재 온라인 방이 없어요.
       </div>`;

    return;

  }

  onlineRoomsList.innerHTML =
    rooms.map(room => `

      <button
        class="onlineRoom"
        data-room="${escapeAttribute(room.room)}">

        <span>
          <span class="onlineRoomName">
            ${escapeHtml(room.room)}
          </span>

          <br>

          <span class="onlineRoomCount">
            ${room.count}/2명
          </span>
        </span>

        <span>›</span>

      </button>

    `).join("");

  document
    .querySelectorAll(".onlineRoom")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          const room =
            button.dataset.room;

          closeSheets();

          joinRoom(room);

        }
      );

    });

}


/* ============================================================
   LOBBY ROOM PUBLISH
============================================================ */

async function publishLobbyRoom(room) {

  if (!lobby) return;

  try {

    await lobby.track({
      type: "room",
      room,
      owner: myClientId
    });

  } catch (error) {

    console.error(
      "Lobby track error:",
      error
    );

  }

}


async function leaveLobbyRoom() {

  if (!lobby) return;

  try {

    await lobby.untrack();

  } catch {}

}


/* ============================================================
   ROOM CHANNEL
============================================================ */

async function setupRoomChannel(
  room,
  createOffer
) {

  if (roomChannel) {

    await roomChannel.unsubscribe();

    roomChannel = null;

  }

  roomChannel =
    sb.channel(
      "pocket-p2p-room:" +
      room,
      {
        config: {
          presence: {
            key: myClientId
          }
        }
      }
    );


  roomChannel.on(
    "broadcast",
    {
      event: "signal"
    },
    async payload => {

      await handleSignal(
        payload.payload
      );

    }
  );


  roomChannel.on(
    "presence",
    {
      event: "sync"
    },
    async () => {

      const state =
        roomChannel.presenceState();

      const count =
        Object.values(state)
          .reduce(
            (sum, arr) =>
              sum + arr.length,
            0
          );

      updateRoomCount(count);

      if (
        createOffer &&
        count === 2 &&
        !pc
      ) {

        isInitiator = true;

        await createPeerConnection();

        await createOfferSignal();

      }

    }
  );


  roomChannel.on(
    "presence",
    {
      event: "join"
    },
    async () => {

      const state =
        roomChannel.presenceState();

      const count =
        Object.values(state)
          .reduce(
            (sum, arr) =>
              sum + arr.length,
            0
          );

      updateRoomCount(count);

      if (
        createOffer &&
        count === 2 &&
        !pc
      ) {

        isInitiator = true;

        await createPeerConnection();

        await createOfferSignal();

      }

    }
  );


  const status =
    await new Promise(resolve => {

      let done = false;

      roomChannel.subscribe(
        async status => {

          if (
            status === "SUBSCRIBED" &&
            !done
          ) {

            done = true;

            resolve(status);

          }

        }
      );

    });


  if (status === "SUBSCRIBED") {

    await roomChannel.track({
      clientId: myClientId
    });

  }

}


/* ============================================================
   ROOM CREATE / JOIN
============================================================ */

async function createRoom() {

  const room =
    roomInput.value.trim();

  if (!room) {

    alert("방 이름을 입력해주세요.");

    return;

  }

  await enterRoom(
    room,
    true
  );

}


async function joinRoom(room) {

  if (!room) return;

  await enterRoom(
    room,
    false
  );

}


async function enterRoom(
  room,
  creator
) {

  await cleanupRoom();

  currentRoom = room;

  isInitiator = creator;

  roomNameEl.textContent =
    room;

  connectionStatus.textContent =
    "방에 접속 중...";

  emptyChat.style.display =
    "none";

  await publishLobbyRoom(room);

  await setupRoomChannel(
    room,
    creator
  );

  connectionStatus.textContent =
    "상대방을 기다리는 중...";

}


/* ============================================================
   ROOM COUNT
============================================================ */

function updateRoomCount(count) {

  if (count >= 2) {

    connectionStatus.textContent =
      pc
        ? "연결 중..."
        : "상대방 접속됨";

  } else {

    connectionStatus.textContent =
      "상대방을 기다리는 중...";

  }

}


/* ============================================================
   WEBRTC
============================================================ */

async function createPeerConnection() {

  if (pc) return pc;

  pc =
    new RTCPeerConnection({
      iceServers: [
        {
          urls:
            "stun:stun.l.google.com:19302"
        },
        {
          urls:
            "stun:stun1.l.google.com:19302"
        }
      ]
    });


  pc.onicecandidate =
    async event => {

      if (
        event.candidate
      ) {

        await sendSignal(
          "ice",
          {
            candidate:
              event.candidate
          }
        );

      }

    };


  pc.onconnectionstatechange =
    () => {

      const state =
        pc?.connectionState;

      if (
        state === "connected"
      ) {

        connectionStatus.textContent =
          "연결됨";

      } else if (
        state === "disconnected" ||
        state === "failed"
      ) {

        connectionStatus.textContent =
          "연결 끊김";

      }

    };


  pc.ondatachannel =
    event => {

      setupDataChannel(
        event.channel
      );

    };


  if (isInitiator) {

    const channel =
      pc.createDataChannel(
        "messages",
        {
          ordered: true
        }
      );

    setupDataChannel(channel);

  }

  return pc;

}


/* ============================================================
   DATA CHANNEL
============================================================ */

function setupDataChannel(channel) {

  dataChannel =
    channel;

  dataChannel.binaryType =
    "arraybuffer";

  dataChannel.onopen =
    () => {

      connectionStatus.textContent =
        "연결됨";

      sendProfile();

    };


  dataChannel.onmessage =
    event => {

      handleDataMessage(
        event.data
      );

    };


  dataChannel.onclose =
    () => {

      connectionStatus.textContent =
        "연결 끊김";

    };

}


/* ============================================================
   SIGNALING
============================================================ */

async function sendSignal(
  type,
  data
) {

  if (!roomChannel) return;

  await roomChannel.send({
    type: "broadcast",
    event: "signal",
    payload: {
      sender: myClientId,
      type,
      ...data
    }
  });

}


async function createOfferSignal() {

  if (!pc) return;

  const offer =
    await pc.createOffer();

  await pc.setLocalDescription(
    offer
  );

  await sendSignal(
    "offer",
    {
      offer
    }
  );

}


async function handleSignal(
  signal
) {

  if (!signal) return;

  if (
    signal.sender === myClientId
  ) {
    return;
  }


  if (
    signal.type === "offer"
  ) {

    isInitiator = false;

    await createPeerConnection();

    await pc.setRemoteDescription(
      new RTCSessionDescription(
        signal.offer
      )
    );

    const answer =
      await pc.createAnswer();

    await pc.setLocalDescription(
      answer
    );

    await sendSignal(
      "answer",
      {
        answer
      }
    );

    await flushIce();

    return;
  }


  if (
    signal.type === "answer"
  ) {

    if (!pc) return;

    await pc.setRemoteDescription(
      new RTCSessionDescription(
        signal.answer
      )
    );

    await flushIce();

    return;
  }


  if (
    signal.type === "ice"
  ) {

    if (!pc) {

      await createPeerConnection();

    }

    const candidate =
      new RTCIceCandidate(
        signal.candidate
      );

    if (
      pc.remoteDescription
    ) {

      await pc.addIceCandidate(
        candidate
      );

    } else {

      pendingIceCandidates.push(
        candidate
      );

    }

  }

}


async function flushIce() {

  if (!pc) return;

  for (
    const candidate
    of pendingIceCandidates
  ) {

    try {

      await pc.addIceCandidate(
        candidate
      );

    } catch {}

  }

  pendingIceCandidates = [];

}


/* ============================================================
   PROFILE EXCHANGE
============================================================ */

function sendProfile() {

  if (
    !dataChannel ||
    dataChannel.readyState !== "open"
  ) {
    return;
  }

  sendJSON({
    type: "profile",
    profile: myProfile
  });

}


function handleRemoteProfile(
  profile
) {

  if (!profile) return;

  remoteProfile = {
    nickname:
      profile.nickname ||
      "Guest",

    avatar:
      profile.avatar ||
      makeAvatar(
        profile.nickname ||
        "Guest"
      ),

    guest:
      !!profile.guest
  };

  connectionStatus.textContent =
    "연결됨";

}


/* ============================================================
   JSON MESSAGE
============================================================ */

function sendJSON(data) {

  if (
    !dataChannel ||
    dataChannel.readyState !== "open"
  ) {
    return false;
  }

  dataChannel.send(
    JSON.stringify(data)
  );

  return true;

}


/* ============================================================
   CHAT
============================================================ */

function sendMessage() {

  const text =
    messageInput.value.trim();

  if (!text) return;

  if (
    !dataChannel ||
    dataChannel.readyState !== "open"
  ) {

    alert(
      "아직 상대방과 연결되지 않았어요."
    );

    return;

  }


  const id =
    randomId();

  sendJSON({
    type: "text",
    id,
    text
  });


  addTextMessage(
    text,
    true,
    myProfile
  );


  messageInput.value = "";

  resizeTextarea();

}


sendButton.addEventListener(
  "click",
  sendMessage
);


messageInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


messageInput.addEventListener(
  "input",
  resizeTextarea
);


function resizeTextarea() {

  messageInput.style.height =
    "auto";

  messageInput.style.height =
    Math.min(
      messageInput.scrollHeight,
      120
    ) + "px";

}


/* ============================================================
   HANDLE DATA
============================================================ */

function handleDataMessage(
  raw
) {

  if (
    typeof raw === "string"
  ) {

    let data;

    try {

      data =
        JSON.parse(raw);

    } catch {

      return;

    }

    if (
      data.type === "profile"
    ) {

      handleRemoteProfile(
        data.profile
      );

      return;

    }


    if (
      data.type === "text"
    ) {

      addTextMessage(
        data.text,
        false,
        remoteProfile ||
        {
          nickname: "상대방",
          avatar: makeAvatar("상")
        }
      );

      return;

    }


    if (
      data.type === "file-start"
    ) {

      startIncomingFile(data);

      return;

    }


    if (
      data.type === "file-end"
    ) {

      finishIncomingFile(data);

      return;

    }

  }


  if (
    raw instanceof ArrayBuffer
  ) {

    receiveFileChunk(raw);

  }

}


/* ============================================================
   MESSAGE RENDER
============================================================ */

function addTextMessage(
  text,
  mine,
  profile
) {

  const message =
    document.createElement("div");

  message.className =
    "message" +
    (mine ? " mine" : "");


  const avatar =
    document.createElement("img");

  avatar.className =
    "messageAvatar";

  avatar.src =
    profile.avatar ||
    makeAvatar(
      profile.nickname
    );


  const body =
    document.createElement("div");

  body.className =
    "messageBody";


  const name =
    document.createElement("div");

  name.className =
    "messageName";

  name.textContent =
    profile.nickname ||
    "Guest";


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  bubble.textContent =
    text;


  body.appendChild(name);
  body.appendChild(bubble);

  message.appendChild(avatar);
  message.appendChild(body);

  chat.appendChild(message);

  scrollChat();

}


function addMediaMessage(
  file,
  url,
  mine,
  profile
) {

  const message =
    document.createElement("div");

  message.className =
    "message" +
    (mine ? " mine" : "");


  const avatar =
    document.createElement("img");

  avatar.className =
    "messageAvatar";

  avatar.src =
    profile.avatar ||
    makeAvatar(
      profile.nickname
    );


  const body =
    document.createElement("div");

  body.className =
    "messageBody";


  const name =
    document.createElement("div");

  name.className =
    "messageName";

  name.textContent =
    profile.nickname ||
    "Guest";


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";


  const type =
    getFileType(file.type);


  if (
    type === "image"
  ) {

    const wrap =
      document.createElement("div");

    wrap.className =
      "mediaPreview";

    const img =
      document.createElement("img");

    img.src = url;

    img.alt =
      file.name;

    img.loading =
      "lazy";

    wrap.appendChild(img);

    bubble.appendChild(wrap);

  }


  else if (
    type === "video"
  ) {

    const wrap =
      document.createElement("div");

    wrap.className =
      "mediaPreview";

    const video =
      document.createElement("video");

    video.src = url;

    video.controls = true;

    video.playsInline = true;

    video.preload = "metadata";

    wrap.appendChild(video);

    bubble.appendChild(wrap);

  }


  else if (
    type === "audio"
  ) {

    const wrap =
      document.createElement("div");

    wrap.className =
      "audioPreview";

    const audio =
      document.createElement("audio");

    audio.src = url;

    audio.controls = true;

    audio.preload = "metadata";

    wrap.appendChild(audio);

    bubble.appendChild(wrap);

  }


  else {

    const card =
      document.createElement("div");

    card.className =
      "fileCard";

    const title =
      document.createElement("div");

    title.className =
      "fileName";

    title.textContent =
      file.name;


    const meta =
      document.createElement("div");

    meta.className =
      "fileMeta";

    meta.textContent =
      formatBytes(file.size);


    const download =
      document.createElement("button");

    download.className =
      "downloadButton";

    download.textContent =
      "다운로드";


    download.onclick =
      () => {

        downloadBlob(
          url,
          file.name
        );

      };


    card.appendChild(title);
    card.appendChild(meta);
    card.appendChild(download);

    bubble.appendChild(card);

  }


  body.appendChild(name);
  body.appendChild(bubble);

  message.appendChild(avatar);
  message.appendChild(body);

  chat.appendChild(message);

  scrollChat();

}


/* ============================================================
   FILE TYPE
============================================================ */

function getFileType(type) {

  if (
    type.startsWith("image/")
  ) {
    return "image";
  }

  if (
    type.startsWith("video/")
  ) {
    return "video";
  }

  if (
    type.startsWith("audio/")
  ) {
    return "audio";
  }

  return "file";

}


/* ============================================================
   FILE PICKER
============================================================ */

fileButton.addEventListener(
  "click",
  () => fileInput.click()
);


fileInput.addEventListener(
  "change",
  async event => {

    const files =
      [...event.target.files];

    fileInput.value = "";

    for (
      const file of files
    ) {

      await sendFile(file);

    }

  }
);


/* ============================================================
   FILE SENDING
============================================================ */

const CHUNK_SIZE =
  48 * 1024;


async function sendFile(file) {

  if (
    !dataChannel ||
    dataChannel.readyState !== "open"
  ) {

    alert(
      "먼저 상대방과 연결해주세요."
    );

    return;

  }


  const id =
    randomId();

  const arrayBuffer =
    await file.arrayBuffer();


  sendJSON({
    type: "file-start",

    id,

    name:
      file.name,

    size:
      file.size,

    mime:
      file.type ||
      "application/octet-stream"
  });


  for (
    let offset = 0;
    offset < arrayBuffer.byteLength;
    offset += CHUNK_SIZE
  ) {

    const chunk =
      arrayBuffer.slice(
        offset,
        Math.min(
          offset + CHUNK_SIZE,
          arrayBuffer.byteLength
        )
      );


    while (
      dataChannel.bufferedAmount >
      4 * 1024 * 1024
    ) {

      await wait(50);

    }


    dataChannel.send(chunk);

  }


  sendJSON({
    type: "file-end",
    id
  });


  const url =
    URL.createObjectURL(
      new Blob(
        [arrayBuffer],
        {
          type:
            file.type ||
            "application/octet-stream"
        }
      )
    );


  addMediaMessage(
    file,
    url,
    true,
    myProfile
  );

}


/* ============================================================
   INCOMING FILE
============================================================ */

function startIncomingFile(data) {

  fileTransfers.set(
    data.id,
    {
      id: data.id,
      name: data.name,
      size: data.size,
      mime:
        data.mime ||
        "application/octet-stream",
      chunks: [],
      received: 0
    }
  );

}


function receiveFileChunk(
  chunk
) {

  const transfer =
    [...fileTransfers.values()]
      .find(
        t =>
          t.received <
          t.size
      );

  if (!transfer) return;

  transfer.chunks.push(
    chunk
  );

  transfer.received +=
    chunk.byteLength;

}


function finishIncomingFile(
  data
) {

  const transfer =
    fileTransfers.get(
      data.id
    );

  if (!transfer) return;


  const blob =
    new Blob(
      transfer.chunks,
      {
        type:
          transfer.mime
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const file =
    new File(
      [blob],
      transfer.name,
      {
        type:
          transfer.mime
      }
    );


  addMediaMessage(
    file,
    url,
    false,
    remoteProfile ||
    {
      nickname: "상대방",
      avatar: makeAvatar("상")
    }
  );


  fileTransfers.delete(
    data.id
  );

}


/* ============================================================
   UTIL
============================================================ */

function wait(ms) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}


function formatBytes(bytes) {

  if (!bytes) return "0 B";

  const units =
    [
      "B",
      "KB",
      "MB",
      "GB"
    ];

  const index =
    Math.floor(
      Math.log(bytes) /
      Math.log(1024)
    );

  return (
    (bytes /
      Math.pow(
        1024,
        index
      ))
      .toFixed(
        index ? 1 : 0
      ) +
    " " +
    units[index]
  );

}


function downloadBlob(
  url,
  filename
) {

  const a =
    document.createElement("a");

  a.href = url;
  a.download = filename;

  document.body.appendChild(a);

  a.click();

  a.remove();

}


function scrollChat() {

  requestAnimationFrame(
    () => {

      chat.scrollTop =
        chat.scrollHeight;

    }
  );

}


function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function escapeAttribute(value) {

  return escapeHtml(value);

}


/* ============================================================
   CLEANUP
============================================================ */

async function cleanupRoom() {

  if (dataChannel) {

    try {
      dataChannel.close();
    } catch {}

    dataChannel = null;

  }


  if (pc) {

    try {
      pc.close();
    } catch {}

    pc = null;

  }


  pendingIceCandidates = [];

  remoteProfile = null;

  if (roomChannel) {

    try {

      await roomChannel.unsubscribe();

    } catch {}

    roomChannel = null;

  }


  await leaveLobbyRoom();

}
